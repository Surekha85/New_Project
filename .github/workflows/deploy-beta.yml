name: Deploy to Beta

on:
  push:
    branches:
      - beta

jobs:
  deploy:
    name: Deploy to Beta Account
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_BETA }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Auth Stack
        env:
          ACCOUNT_ID: "513691871442"
          CI: true
        run: |
          chmod +x ./deploy-assistants.sh ./zip-all-lambdas.sh
          ./deploy-assistants.sh beta