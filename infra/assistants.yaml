          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Credentials: true


  AdminAssignsAssistantOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref AssignAssistantsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Credentials: "'true'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Credentials: true
  
  ############################################################
  # Lambda Permissions for API Gateway
  ############################################################
  CreateAdminsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateAdminsLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/POST/admin/create-admin"

  AdminLoginLogoutLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminLoginLogoutLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/POST/admin/login-logout"

  CreateAssistantsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateAssistantsLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/POST/admin/create-assistant"

  GetAllAssistantsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetAllAssistantsLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/GET/admin/assistants"
  
  GetAssistantByIdLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetAssistantByIdLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/GET/admin/assistants/*"

  GetAllCandidatesLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetAllCandidatesLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/GET/admin/candidates"

  GetCandidateProfileByIdLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetCandidateProfileByIdLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/GET/admin/candidates/*"

  AssignAssistantForCandidateLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AssignAssistantForCandidateLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminPortalApi}/*/POST/admin/assign-assistant"
  

  ############################################################
  # Default Gateway Responses for CORS on Errors
  ############################################################
  GatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref AdminPortalApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "method.request.header.Origin"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Credentials: "'true'"

  GatewayResponse5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref AdminPortalApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "method.request.header.Origin"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Credentials: "'true'"


  ############################################################
  # 8. Stage Deployment
  ############################################################
  AdminPortalDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref AdminPortalApi
      StageName: !Ref Stage
      Description: !Sub "Admin Portal API deployment at ${AdminApiDeploymentVersion}"
    DependsOn:
    # Lambda-backed methods
      - CreateAdminsMethod
      - AdminLoginLogoutMethod
      - CreateAssistantMethod
      - GetAssistantsMethod
      - GetAssistantByIdMethod
      - GetAllCandidatesMethod
      - GetCandidateProfileByIdMethod
      - AssignAssistantForCandidateMethod
      # OPTIONS (CORS) methods
      - AdminOptionsMethod
      - AdminLoginLogoutOptionsMethod
      - CreateAssistantsOptionsMethod
      - GetAllAssistantsOptionsMethod
      - GetAssistantByIdOptionsMethod
      - GetAllCandidatesOptionsMethod
      - CandidateProfileByIdOptionsMethod
      - AdminAssignsAssistantOptionsMethod
      # Permission
      - CreateAdminsLambdaPermission
      - AdminLoginLogoutLambdaPermission
      - CreateAssistantsLambdaPermission
      - GetAllAssistantsLambdaPermission
      - GetAssistantByIdLambdaPermission
      - GetAllCandidatesLambdaPermission
      - GetCandidateProfileByIdLambdaPermission
      - AssignAssistantForCandidateLambdaPermission



Outputs:
  # API Gateway
  AdminPortalApiId:
    Description: "API Gateway ID"
    Value: !Ref AdminPortalApi 

  CandidateApiRootResourceId:
    Description: "Root Resource ID of the Candidate API"
    Value: !GetAtt AdminPortalApi.RootResourceId

  AdminPortalApiInvokeUrl:
    Description: "Assistant Portal API URL"
    Value: !Sub "https://${AdminPortalApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"

  # Dynamo DB
  AdminsTableName:
    Description: "DynamoDB table for admins"
    Value: !Ref AdminsTable

  CreateAdminsLambdaArn:
    Description: "ARN of the Create Admins Lambda function"
    Value: !GetAtt CreateAdminsLambda.Arn

  # IAM Role
  AdminPortalLambdaRoleName:
    Description: "IAM Role used by all Lambda functions"
    Value: !Ref AdminPortalLambdaRole

   