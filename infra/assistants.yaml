AWSTemplateFormatVersion: "2010-09-09"
Description: Jobsyme Admin Portal – AWS Infrastructure

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - alpha
    Description: Deployment stage
  AdminApiDeploymentVersion:
    Type: String
    Default: "Version1"
    Description: Version to force API Gateway redeployment
  
  CandidateAccountId:
    Type: String
    Description: "AWS Account ID for Candidate account (for cross-account access)"
  
  CandidatesTableName:
    Type: String
    Description: "Candidates table (from Candidates account)"

  AssistantsTableName:
    Type: String
    Description: "Assistants table (from Assistants account)"

  JobApplicationsTableName:
    Type: String

  PortfolioTableName:
    Type: String

  GitHubActivitiesTableName:
    Type: String

  LinkedInActivitiesTableName:
    Type: String
  
  PaymentsTableName:
    Type: String
    Description: "Payments table (from Candidate account)"
  
  CandidateCrossAccountRoleArn:
    Type: String
    Description: "Cross-account IAM role ARN from Candidate account"

  AssistantCrossAccountRoleArn:
    Type: String
    Description: "Cross-account IAM role ARN from Assistant account"


Resources:
  ########################################
  # DynamoDB Tables
  ########################################
  AdminsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "jobsyme-${Stage}-admins"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: adminId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: adminId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ############################################################
  # IAM
  ############################################################
  AdminPortalLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "jobsyme-${Stage}-AdminPortalLambdaRole"

      # ============================
      # TRUST POLICY (WHO can assume)
      # ============================
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      # ============================
      # AWS MANAGED POLICIES
      # ============================
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      # ============================
      # INLINE PERMISSION POLICIES
      # ============================
      Policies:

        # 🔐 Cross Account Role Assume
        - PolicyName: AdminAssumeCrossAccountRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Ref CandidateCrossAccountRoleArn
                  - !Ref AssistantCrossAccountRoleArn

        # 🗂️ Admin account–local permissions only
        - PolicyName: AdminLocalAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # S3 access (admin-owned buckets only)
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: "*"

              # Admin account DynamoDB table ONLY
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt AdminsTable.Arn
                  - !Sub "${AdminsTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/admin/jwt-secret*"

        # 🌍 Cross Account DynamoDB Tables
        - PolicyName: CrossAccountTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                Resource:

                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-payments-table"

                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-candidates-details-table"
                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-candidates-details-table/index/*"

                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-assistants-table"
                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-assistants-table/index/*"

                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-job-applications-table"
                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-job-applications-table/index/*"

                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-portfolio-table"

                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-github-activities-table"
                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-github-activities-table/index/*"

                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-linkedin-activities-table"
                  - !Sub "arn:aws:dynamodb:us-east-1:${CandidateAccountId}:table/jobsyme-alpha-linkedin-activities-table/index/*"


  ############################################################
  # Lambdas
  ############################################################ 
  CreateAdminsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-create-admin"
      Description: "Create new admin user"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          ADMINS_TABLE: !Ref AdminsTable
      Code: ../lambdas/create_admins_lambda.zip

  AdminLoginLogoutLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-login-logout"
      Description: "Admin Login and Logout"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 20
      MemorySize: 512
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          ADMINS_TABLE: !Ref AdminsTable
          # JWT secret name in Secrets Manager
          JWT_SECRET_NAME: !Sub "/admin/jwt-secret"
          # Stage (prod/beta/gamma)
          STAGE: !Ref Stage
      Code: ../lambdas/admin_login_logout_lambda.zip

  CreateAssistantsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-create-assistants"
      Description: "Admins will Creates assistant users"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 20
      MemorySize: 512
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          JWT_SECRET_NAME: !Sub "/admin/jwt-secret"
          ASSISTANT_DYNAMO_ROLE_ARN: !Ref AssistantCrossAccountRoleArn
          ASSISTANTS_TABLE: !Ref AssistantsTableName
          CANDIDATE_DYNAMO_ROLE_ARN: !Ref CandidateCrossAccountRoleArn
          CANDIDATES_TABLE: !Ref CandidatesTableName
      Code: ../lambdas/create_assistants_lambda.zip

  GetAllAssistantsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-get-all-assistants"
      Description: "Admins can able to see the Assistants"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 20
      MemorySize: 512
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          ASSISTANT_DYNAMO_ROLE_ARN: !Ref AssistantCrossAccountRoleArn
          JWT_SECRET_NAME: !Sub "/admin/jwt-secret"
          ASSISTANTS_TABLE: !Ref AssistantsTableName
      Code: ../lambdas/get_all_assistants_lambda.zip
  
  GetAssistantByIdLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-get-assistant-by-id"
      Description: "Get particular Assistant Details by ID"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 20
      MemorySize: 512
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          ASSISTANT_DYNAMO_ROLE_ARN: !Ref AssistantCrossAccountRoleArn
          JWT_SECRET_NAME: !Sub "/admin/jwt-secret"
          ASSISTANTS: !Ref AssistantsTableName
      Code: ../lambdas/get_assistant_by_id_lambda.zip

  GetAllCandidatesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-get-all-candidates"
      Description: "Get all Candidates Details"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 20
      MemorySize: 512
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          CANDIDATE_DYNAMO_ROLE_ARN: !Ref CandidateCrossAccountRoleArn
          ASSISTANT_DYNAMO_ROLE_ARN: !Ref AssistantCrossAccountRoleArn
          JWT_SECRET_NAME: !Sub "/admin/jwt-secret"
          CANDIDATES_TABLE: !Ref CandidatesTableName
          PAYMENTS_TABLE: !Ref PaymentsTableName

          ASSISTANTS_TABLE: !Ref AssistantsTableName

          JOB_APPLICATIONS_TABLE: !Ref JobApplicationsTableName

          PORTFOLIO_TABLE: !Ref PortfolioTableName

          GITHUB_ACTIVITIES_TABLE: !Ref GitHubActivitiesTableName

          LINKEDIN_ACTIVITIES_TABLE: !Ref LinkedInActivitiesTableName
      Code: ../lambdas/get_all_candidates_lambda.zip

  
  GetCandidateProfileByIdLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-get-candidate-profile-by-id"
      Description: "Get particular Candidate Details by ID"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 20
      MemorySize: 512
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          CANDIDATE_DYNAMO_ROLE_ARN: !Ref CandidateCrossAccountRoleArn
          ASSISTANT_DYNAMO_ROLE_ARN: !Ref AssistantCrossAccountRoleArn
          JWT_SECRET_NAME: !Sub "/admin/jwt-secret"
          CANDIDATES_TABLE: !Ref CandidatesTableName

          ASSISTANTS_TABLE: !Ref AssistantsTableName

          JOB_APPLICATIONS_TABLE: !Ref JobApplicationsTableName

          PORTFOLIO_TABLE: !Ref PortfolioTableName

          GITHUB_ACTIVITIES_TABLE: !Ref GitHubActivitiesTableName

          LINKEDIN_ACTIVITIES_TABLE: !Ref LinkedInActivitiesTableName
      Code: ../lambdas/get_candidate_profile_by_id_lambda.zip

  AssignAssistantForCandidateLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-admin-assign-assistant"
      Description: "Admin will Assign Assistant for a candidate"
      Runtime: python3.10
      Handler: app.handler
      Timeout: 20
      MemorySize: 512
      Role: !GetAtt AdminPortalLambdaRole.Arn
      Environment:
        Variables:
          JWT_SECRET_NAME: !Sub "/admin/jwt-secret"
          # 🔐 ONE role for ALL cross-account tables
          CANDIDATE_DYNAMO_ROLE_ARN: !Ref CandidateCrossAccountRoleArn
          ASSISTANT_DYNAMO_ROLE_ARN: !Ref AssistantCrossAccountRoleArn
          
          CANDIDATES_TABLE: !Ref CandidatesTableName
          ASSISTANTS: !Ref AssistantsTableName
      Code: ../lambdas/assign_assistant_for_candidate_lambda.zip


  ############################################################
  # API Gateway
  ############################################################
  AdminPortalApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "jobsyme-admin-portal-${Stage}-api"
      Description: REST API for Admin Portal operations
      EndpointConfiguration:
        Types: [REGIONAL]

  ############################################################
  # API Gateway Resources
  ############################################################
  AdminResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt AdminPortalApi.RootResourceId
      PathPart: "admin"
      RestApiId: !Ref AdminPortalApi
  
  CreateAdminsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AdminResource
      PathPart: "create-admin"
      RestApiId: !Ref AdminPortalApi

  # admin/login-logout
  AdminLoginLogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AdminResource
      PathPart: "login-logout"
      RestApiId: !Ref AdminPortalApi

  # admin/create-assistant
  CreateAssistantsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AdminResource
      PathPart: "create-assistant"
      RestApiId: !Ref AdminPortalApi
  
  # admin/assistants
  GetAssistantsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AdminResource
      PathPart: "assistants"
      RestApiId: !Ref AdminPortalApi
  
  # admin/assistants/assistantId
  AssistantByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref GetAssistantsResource
      PathPart: "{assistantId}"
      RestApiId: !Ref AdminPortalApi

  # admin/candidates
  CandidatesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AdminResource
      PathPart: "candidates"
      RestApiId: !Ref AdminPortalApi

  # admin/candidates/candidateId
  CandidateIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref CandidatesResource
      PathPart: "{candidateId}"
      RestApiId: !Ref AdminPortalApi

  # admin/assign-assistant
  AssignAssistantsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AdminResource
      PathPart: "assign-assistant"
      RestApiId: !Ref AdminPortalApi


  ############################################################
  # API Methods
  ############################################################  
  CreateAdminsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref CreateAdminsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateAdminsLambda.Arn}/invocations"

  # POST/admin/login-logout
  AdminLoginLogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref AdminLoginLogoutResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminLoginLogoutLambda.Arn}/invocations"


  CreateAssistantMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref CreateAssistantsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateAssistantsLambda.Arn}/invocations"

  GetAssistantsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref GetAssistantsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetAllAssistantsLambda.Arn}/invocations"
  
  GetAssistantByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref AssistantByIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetAssistantByIdLambda.Arn}/invocations"
        
  GetAllCandidatesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref CandidatesResource
      HttpMethod: GET
      AuthorizationType: NONE
