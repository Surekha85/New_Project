AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Candidate Portal Infrastructure for JobSyme


Parameters:
  Stage:
    Type: String
    AllowedValues:
      - beta
      - gamma
      - prod
    Description: Deployment stage (beta, gamma, prod)

Resources:
  #  S3 Buckets
  ########################################
  # it stores candidate profiles (resumes, files..)  
  CandidateProfileBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "jobsyme-${Stage}-assistant-profile"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  
  ########################################
  # DynamoDB Tables
  ########################################
  AssistantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "jobsyme-${Stage}-assistants"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: candidateId
          AttributeType: S
      KeySchema:
        - AttributeName: candidateId
          KeyType: HASH


  # -----------------------
  # Lambda Functions
  # -----------------------
  AssistantsLogoutFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-assistants_login"
      Runtime: python3.10
      Timeout: 15
      MemorySize: 128
      Handler: app.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CANDIDATES_TABLE: !Ref AssistantsTable
      Code:
        S3Bucket: !Sub "jobsyme-assitants-infra-${Stage}"
        S3Key: !Sub "jobsyme-assistants/${Stage}/assistants_logout_lambda.zip"

  AssistantsLoginFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Sub "jobsyme-${Stage}-assistants_logout"
      Runtime: python3.10
      Timeout: 15
      MemorySize: 128
      Handler: app.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          JOB_APPLICATIONS_TABLE: !Ref AssistantsTable
      Code:
        S3Bucket: !Sub "jobsyme-assistants-infra-${Stage}"
        S3Key: !Sub "jobsyme-assistants/${Stage}/assistants_login_lambda.zip"

