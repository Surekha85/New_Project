        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetAllCandidatesLambda.Arn}/invocations"

  GetCandidateProfileByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminPortalApi
      ResourceId: !Ref CandidateIdResource
      HttpMethod: GET
      AuthorizationType: NONE
